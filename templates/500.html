<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Erro de Sistema - 500</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0">
    <style>
        .error-container { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; text-align: center; }
        .error-card { padding: 60px; max-width: 600px; border-radius: 15px; background-color: rgba(10, 10, 10, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .error-code { font-size: 6rem; font-weight: bold; color: #da3633; margin: 0; line-height: 1; text-shadow: 0 0 20px rgba(218, 54, 51, 0.5); }
        .error-title { color: #fff; font-size: 1.5rem; margin-bottom: 20px; }
        .error-desc { color: #ccc; margin-bottom: 30px; font-size: 1.1rem; }
        .btn-home { display: inline-block; background: #da3633; color: white; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-home:hover { background: #ff4d4d; box-shadow: 0 0 15px rgba(218, 54, 51, 0.5); }
    </style>
</head>
<body class="dashboard-body">

    <div class="video-container">
    <img src="{{ url_for('static', filename='images/fundo_erro.png') }}" 
         style="width: 100vw; 
                height: 100vh; 
                object-fit: cover; 
                position: fixed; 
                top: 0; 
                left: 0; 
                z-index: -1;">
</div>

    <div class="error-container">
        <div class="error-card">
            <h1 class="error-code">500</h1>
            <h2 class="error-title">Sobrecarga na Rede Neural</h2>
            <p class="error-desc">Ocorreu um erro interno no servidor ao tentar processar o seu pedido. Nossos algoritmos já foram notificados e estão trabalhando para reparar a falha.</p>
            
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}" class="btn-home">Voltar ao Painel Seguramente</a>
            {% else %}
                <a href="{{ url_for('home') }}" class="btn-home">Retornar à Base</a>
            {% endif %}
        </div>
    </div>

</body>
</html>
